# Home Assistant pour Synology DS223 (Container Manager).
# Voir docs/installation-synology.md pour la marche à suivre.
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    # Indispensable : Home Assistant doit être sur le réseau local
    # pour découvrir et piloter les appareils Tuya et Tapo.
    network_mode: host
    volumes:
      - /volume1/docker/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
