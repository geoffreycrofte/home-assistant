<!doctype html>
<html lang="fr" data-theme="soda-pop" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#391E34" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <title>Kitten's Nest</title>
    <script>
      // Applique le thème mémorisé avant le premier rendu (évite un flash de couleurs).
      // La logique complète est dans src/theme/ThemeProvider.tsx.
      try {
        var t = localStorage.getItem("maison.theme");
        var m = localStorage.getItem("maison.colorMode") || "system";
        // Garder cette liste alignée sur THEMES (src/theme/themes.ts).
        if (["soda-pop", "ambre"].indexOf(t) !== -1) document.documentElement.dataset.theme = t;
        if (m === "system") m = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.mode = m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
